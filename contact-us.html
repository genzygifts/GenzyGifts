<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Contact Us - Genzy Gifts</title>
<link href="https://fonts.googleapis.com/css?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
:root { --color-bg-dark: #5C1A00; --color-bg-darker: #2C0A0A; --color-card-bg: #ffffff; --color-primary-text: #000000; --color-primary-btn: #FF6B00; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
html, body { height: 100%; display: flex; justify-content: center; align-items: center; background: #000; }
#app-container { width: 100vw; height: 100vh; max-width: min(100vw, 56.25vh); max-height: min(100vh, 177.78vw); margin: auto; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--color-bg-dark) 0%, var(--color-bg-darker) 100%); box-shadow: 0 0 40px rgba(255, 107, 53, 0.6); color: var(--color-primary-text); overflow-y: auto; }
#content-page { flex-grow: 1; background-color: var(--color-card-bg); padding: 15px; border-radius: 15px 15px 0 0; }
.header { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #ddd; margin-bottom: 15px; }
.back-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--color-primary-btn); padding-right: 15px; text-decoration: none; }
.header h1 { font-size: 18px; font-weight: 700; }
.page-content p, .page-content a { font-size: 12px; line-height: 1.6; color: #333; margin-bottom: 10px; }
.contact-links a { color: var(--color-primary-btn); text-decoration: none; display: block; margin-bottom: 8px; }
</style>
</head>
<body>
<div id="app-container">

      <div class="contact-links">
        <a href="https://wa.me/919226949557" target="_blank"><i class="fab fa-whatsapp"></i> WhatsApp: +91 92269 49557</a>
        <a href="mailto:support@genzygifts.com" target="_blank"><i class="fas fa-envelope"></i> support@genzygifts.com</a>
        <a href="tel:+919226949557"><i class="fas fa-phone"></i> +91 92269 49557</a>
      </div>
      <p>Our support team is available 24/7 to ensure a smooth shopping experience.</p>
    </div>
  </div>
</div>
</body>
