<style>
/* --- STYLES (V25 - Attractive Professional Design) --- */
:root {
--color-bg-dark: #1e2a78; /* Navy Blue */
--color-bg-darker: #131b46; /* Deeper Navy */
--color-card-bg: #ffffff;
--color-primary-text: #000000;
--color-primary-btn: #1e2a78; /* Navy Button */
--color-price-flash: #dc3545; /* Red for urgency */
--color-gold: #FFD700; /* Gold Accent */
--color-border: #dddddd; /* Light grey border */
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Poppins', sans-serif;
-webkit-tap-highlight-color: transparent;
user-select: none;
}
html, body {
height: 100%;
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
background: #f5f5f5; /* Light grey background */
}
#app-container {
width: 100vw;
height: 100vh;
max-width: min(100vw, 56.25vh);
max-height: min(100vh, 177.78vw);
margin: auto;
display: flex;
flex-direction: column;
background: #ffffff; /* White content background */
box-shadow: 0 0 20px rgba(0, 0, 0, 0.2); /* Soft shadow */
color: var(--color-primary-text);
position: relative;
overflow-y: auto; 
overflow-x: hidden;
}

/* 1. PROFESSIONAL BANNER/HEADER (V25) */
.diya-decoration { display: none; } /* Remove Diya */
#top-header-wish { 
    text-align: center; 
    padding: 20px 10px 15px 10px; 
    color: #ffffff; 
    background: var(--color-bg-dark); /* Solid Navy background for banner look */
    font-weight: 600; 
    position: relative; 
    z-index: 10; 
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); 
}
.store-title-top {
    font-size: 16px;
    font-weight: 700;
    color: var(--color-gold); /* Gold accent for brand name */
    text-transform: uppercase;
    margin-top: 0;
}
.receiver-header { 
    font-size: 24px; 
    font-weight: 900; 
    color: #ffffff; /* White text */
    text-shadow: none; 
    font-family: 'Poppins', sans-serif;
    margin-bottom: 0; 
    margin-top: 5px;
}
.festival-text { display: none; } /* Remove festival text */

/* 2. CONTENT AREA */
#content-area {
    padding: 10px; 
    flex-grow: 1;
    background-color: var(--color-card-bg); /* White background for the main content area */
}
#product-card { 
    border: 1px solid var(--color-border); /* Light border */
    border-radius: 15px; padding: 12px; margin: 5px 0; 
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05); /* Lighter shadow */
    text-align: left; flex-shrink: 0; 
    position: relative; 
}

/* 3. SHARE SECTION (Dark Professional Footer) */
#share-section-box {
    background: var(--color-bg-dark); /* Dark section background */
    padding: 15px;
    color: #ffffff;
    flex-shrink: 0;
}
.share-input-field {
    border: 1px solid #ffffff; /* White border */
    background: rgba(255, 255, 255, 0.1); /* Slightly transparent white background */
    color: #ffffff;
}

/* Price Display (Remains same for dynamic pricing) */
#price-section { display: flex; justify-content: center; align-items: center; margin: 10px 0; }
.price-item { text-align: center; padding: 5px 15px; border-radius: 8px; background-color: #f7e6e1; border: 2px solid var(--color-price-flash); }
.price-item-label { display: block; font-size: 14px; font-weight: 700; color: var(--color-price-flash); }
.price-item-value { display: block; font-size: 26px; font-weight: 900; color: #000; }

/* Media Aspect Ratio and other core styles remain */
#media-box-wrapper { position: relative; width: 100%; overflow: hidden; border-radius: 8px; background: #f0f0f0; margin-bottom: 8px; border: 1px solid #ddd; }
#media-box { position: absolute; top: 0; left: 0; width: 100%; height: 100%; cursor: pointer; }
.carousel-image, .product-media-video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.5s ease-in-out; }
.product-media-video { opacity: 1; }
.carousel-image.active { opacity: 1; }
.form-group-qty { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 600; }
.qty-control { display: flex; align-items: center; gap: 10px; }
.qty-btn { background: #f0f0f0; color: #000; border: 1px solid #ccc; width: 30px; height: 30px; border-radius: 4px; font-size: 16px; font-weight: 700; cursor: pointer; }
#floating-whatsapp {
    position: fixed; right: calc(50% - min(50vw, 281.25px) + 15px); bottom: 15px; background-color: #25D366; 
    color: white; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; 
    justify-content: center; font-size: 28px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); z-index: 1000; 
    text-decoration: none; user-select: none; transition: transform 0.2s;
}
#floating-whatsapp:active { transform: scale(0.9); }
</style>
</head>
<body oncontextmenu="return false;" onkeydown="return checkKey(event);">
<div id="app-container">

<div id="top-header-wish">
    <h2 class="store-title-top">+ Genzy Gifts +</h2>
    <h1 class="receiver-header">Welcome, <span id="receiver-display-top">Priya</span>!</h1>
    <span class="audio-icon-btn" onclick="playAudioManually()" title="Play Audio" style="position: absolute; right: 15px; top: 20px; font-size: 20px;">🔊</span>
</div>

<div id="content-area">
<div id="product-card">
<h4 id="product-name-static" class="product-name-main">Loading Product...</h4>
<div id="review-bar">
<span class="stars">⭐⭐⭐⭐⭐</span>

</div>

<div id="media-box-wrapper">
    <div id="media-box" onclick="toggleMediaPlay()"> 
        <div id="media-carousel"></div>
        <div class="carousel-dots" id="carousel-dots"></div>
    </div>
</div>

<div id="details-box">
<div id="price-section">
    <div class="price-item" id="price-current-display">
        <span class="price-item-label">FLASH SALE</span>
        <span class="price-item-value">₹<span id="price-current">799</span></span>
    </div>
</div>

<p id="description-text">Loading...</p>
<button id="buy-now-btn" class="btn-base primary-btn" disabled>🛒 Loading...</button>
</div>
</div>
<div id="share-section-box">
<p id="share-label">❤️ Add Your Name And Receiver Name</p>
<div id="share-input-group">
<div id="offer-timer-share">
<span id="offer-end-text">⏰ Offer End:</span>
<div id="timer-inner">
<div id="countdown">00H : 00M : 00S</div>
</div>
</div>
<div class="share-input-row">
<div class="input-group">
<label class="input-label-white">Your Name</label>
<input type="text" id="share-sender-input" class="share-input-field" placeholder="Your Name"
autocomplete="off" value="Sunil">
</div>
<div class="input-group">
<label class="input-label-white">Friend Name</label>
<input type="text" id="share-receiver-input" class="share-input-field" placeholder="Friend
Name" autocomplete="off" value="Ram">
</div>
</div>
<button id="share-btn" class="share-btn btn-base">Share Wish</button>
</div>
</div>
</div>
</div>

<a id="floating-whatsapp" href="#" target="_blank" title="WhatsApp Support">
    <i class="fab fa-whatsapp"></i>
</a>


<audio id="tts-audio" preload="none" hidden></audio>
<div id="modal" class="hidden">
<div class="modal-content">
<button class="close-btn" onclick="hideModal()" aria-label="Close">×</button>
<div id="modal-body"></div>
</div>
</div>
<script>
// === CONFIGURATION ===
const CONFIG = {
    ORDER_SUBMIT_API:
        "https://script.google.com/macros/s/AKfycbyQoweTvVkWVWQRo72rNrJI_Qk4uw2TcLTRJwkvlr0ZWXrf6U3jnDOA9MKo7WPyEco8/exec",
    ADMIN_WHATSAPP: "919226949557",
    BASE_STORE_URL: "https://genzygifts.github.io/GenzyGifts/",
    PRODUCT_JSON_FILE: "product_data.json"
};

let currentProduct = null, audioPlayed = false, carouselTimer = null, currentMediaIndex = 0;
let currentVideo = null; 
let currentPrice = 799; // V24: Initial price set here
let isOfferExpired = false; // V24: Flag to track timer status

// === UTILITY FUNCTIONS ===
function checkKey(e) {
    if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 83))
        || (e.ctrlKey && e.keyCode === 85)) {
        e.preventDefault();
        return false;
    }
    if (e.key === 'Escape') hideModal();
    return true;
}
function getUrlParams() {
    const params = {};
    window.location.search.substring(1).split("&").forEach(pair => {
        const [key, value] = pair.split("=").map(decodeURIComponent);
        if (key) params[key] = value;
    });
    return params;
}
function showModal(content) {
    document.getElementById("modal-body").innerHTML = content;
    document.getElementById("modal").classList.remove("hidden");
}
function hideModal() {
    document.getElementById("modal").classList.add("hidden");
    if (currentVideo && !currentVideo.paused) {
        currentVideo.pause();
    }
}
// === TIMER & PRICE LOGIC (V24 UPDATE) ===
function startCountdown() {
    const TIMER_KEY = 'diwali_offer_timer';
    let countDownDate;
    const saved = localStorage.getItem(TIMER_KEY);
    if (saved) {
        countDownDate = parseInt(saved);
    } else {
        const minutes = Math.floor(Math.random() * 6) + 10;
        countDownDate = new Date().getTime() + minutes * 60 * 1000;
        localStorage.setItem(TIMER_KEY, countDownDate.toString());
    }
    
    const OFFER_PRICE = 799;
    const EXPIRY_PRICE = 999;
    const countdownElement = document.getElementById("countdown");
    const priceElement = document.getElementById("price-current");
    const labelElement = document.querySelector('#price-current-display .price-item-label');
    const buyBtn = document.getElementById("buy-now-btn");

    const x = setInterval(() => {
        const now = new Date().getTime(), distance = countDownDate - now;

        if (distance < 0) {
            clearInterval(x);
            countdownElement.innerHTML = "EXPIRED!";
            isOfferExpired = true;
            currentPrice = EXPIRY_PRICE; // Set 999
            
            priceElement.textContent = EXPIRY_PRICE; 
            labelElement.textContent = "NORMAL PRICE";
            if (buyBtn) { 
                buyBtn.textContent = `🛒 Buy Now ₹${EXPIRY_PRICE}`; 
                buyBtn.disabled = false;
            }
            localStorage.removeItem(TIMER_KEY);
            return;
        }

        // Timer Running Price (799)
        currentPrice = OFFER_PRICE; 
        priceElement.textContent = OFFER_PRICE;
        labelElement.textContent = "FLASH SALE";
        if (buyBtn && currentProduct) {
            buyBtn.textContent = `🛒 Buy Now ₹${OFFER_PRICE}`;
        }

        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        
        countdownElement.innerHTML = (hours < 10 ? "0" + hours : hours) + "H : " + (minutes < 10 ?
            "0" + minutes : minutes) + "M : " + (seconds
                < 10 ? "0" + seconds : seconds) + "S";
    }, 1000);
}
// === AUDIO & MEDIA AUTOPLAY LOGIC (Same as V23) ===
function generateTtsUrl(receiverName, senderName) {
    const TTS_ENDPOINT =
        "https://corsproxy.io/?https://translate.google.com/translate_tts?ie=UTF-8&tl=hi&client=tw-ob&q=";
    const params = getUrlParams(), shareStatus = params.status;
    let ttsMessage;

    if (shareStatus === "bought") {
        ttsMessage = `नमस्ते${receiverName}! आपके दोस्त ${senderName} ने भी इसे अभी-अभी order किया है।`;
    } else if (params.sender && "Priya" !== params.sender) { 
        ttsMessage = `नमस्ते${receiverName}! ${senderName} की ओर से यह special offer आपके लिए है।`;
    } else {
        ttsMessage = `नमस्ते${receiverName}! अपना name डालके Wish share करें।`;
    }
    return TTS_ENDPOINT + encodeURIComponent(ttsMessage);
}

function playAudio(receiverName) {
    if (audioPlayed || !currentProduct) return;
    const params = getUrlParams(), senderName = params.sender || "Priya"; 
    const audio = document.getElementById("tts-audio");
    audio.src = generateTtsUrl(receiverName, senderName);
    
    audio.onended = () => { 
        audioPlayed = true;
        if (currentVideo) {
            currentVideo.muted = false;
            currentVideo.play().catch(e => console.warn("Video auto-play failed after TTS:", e));
        }
    };
    
    audio.play().catch(() => { 
        audioPlayed = false;
        setTimeout(() => {
            if (currentVideo) {
                currentVideo.muted = false;
                currentVideo.play().catch(e => console.warn("Video auto-play failed (TTS fail delay):", e));
            }
        }, 3000); 
    });
}

function playAudioManually() {
    const params = getUrlParams();
    const receiverName = params.sender ? decodeURIComponent(params.sender) : "Priya";
    audioPlayed = false;
    playAudio(receiverName);
}
// === FETCH PRODUCT DATA ===
async function fetchProductData() {
    try {
        const response = await fetch(CONFIG.PRODUCT_JSON_FILE);
        if (!response.ok) throw new Error("Failed to fetch product_data.json. Check file path on GitHub.");
        const data = await response.json();
        currentProduct = data;
        updateStoreUI();
    } catch (error) {
        console.error("Error fetching product data:", error);
        document.getElementById("product-name-static").textContent = "DATA ERROR: Product Not Found";
        document.getElementById("buy-now-btn").textContent = "Error";
        document.getElementById("buy-now-btn").disabled = true;
    }
}
// === UPDATE STORE UI ===
function updateStoreUI() {
    if (!currentProduct) return;
    const params = getUrlParams(), finalReceiverName = params.sender ?
        decodeURIComponent(params.sender) : "Priya";
    
    document.getElementById("receiver-display-top").textContent = finalReceiverName;
    document.getElementById("product-name-static").textContent = currentProduct["Product Name"] || "Exclusive Gift Box";
    
    const reviewBar = document.querySelector('#review-bar .review-count');
    if(reviewBar) reviewBar.textContent = `(${currentProduct.reviews || 0} Reviews | ${currentProduct.rating || 4.5}/5)`;

    const descText = currentProduct.Description || "Experience the joy...";
    document.getElementById("description-text").textContent = descText;

    document.getElementById("buy-now-btn").disabled = false;
    
    // Set WhatsApp link
    const waLink = `https://wa.me/${CONFIG.ADMIN_WHATSAPP}?text=Hi! I am interested in the ${currentProduct["Product Name"]} (Current Price: ₹${currentPrice})`;
    document.getElementById("floating-whatsapp").href = waLink;

    startMediaDisplay();
    startCountdown();
    setTimeout(() => { if (!audioPlayed) playAudio(finalReceiverName); }, 1000);
}
// === MEDIA DISPLAY (Same as V23) ===
function startMediaDisplay() {
    const mediaWrapper = document.getElementById("media-box-wrapper");
    const mediaContainer = document.getElementById("media-carousel"), dotsContainer =
        document.getElementById("carousel-dots");
    mediaContainer.innerHTML = "";
    dotsContainer.innerHTML = "";
    clearInterval(carouselTimer);
    
    const mediaCount = parseInt(currentProduct.Media_Count || 0);
    const hasVideo = currentProduct.Has_Video === true;

    if (hasVideo && mediaCount > 0) {
        mediaWrapper.style.paddingTop = '177.77%'; // 9:16 Aspect Ratio
        
        const video = document.createElement("video");
        video.src = "1.mp4"; 
        video.className = "product-media-video";
        video.setAttribute("loop", "");
        video.setAttribute("autoplay", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("muted", ""); 
        
        currentVideo = video; 

        video.onerror = () => { 
            console.warn("Video failed to load. Falling back to images.");
            video.remove(); 
            currentVideo = null;
            mediaWrapper.style.paddingTop = '100%'; // Fallback to 1:1
            startImageCarousel(mediaCount, mediaContainer, dotsContainer); 
        };
        
        mediaContainer.appendChild(video);
    } else if (mediaCount > 0) {
        mediaWrapper.style.paddingTop = '100%'; // 1:1 Aspect Ratio
        startImageCarousel(mediaCount, mediaContainer, dotsContainer);
    } else {
        mediaWrapper.style.paddingTop = '100%';
        mediaContainer.innerHTML = '<div class="media-loading">🖼️</div>'; 
    }
}

function toggleMediaPlay() {
    if (document.getElementById("tts-audio").played.length > 0 && !document.getElementById("tts-audio").paused) {
        document.getElementById("tts-audio").pause();
        audioPlayed = true; 
    }
    
    if (currentVideo) {
        if (currentVideo.paused) {
            currentVideo.muted = false; 
            currentVideo.play().catch(e => console.error("Video play failed on click:", e));
        } else {
            currentVideo.pause();
        }
    }
}

function startImageCarousel(count, container, dotsContainer) {
    for (let i = 1; i <= count; i++) {
        const img = document.createElement("img");
        img.className = "carousel-image";
        img.src = `${i}.jpg`; 
        if (i === 1) img.classList.add('active');
        container.appendChild(img);
        
        const dot = document.createElement("div");
        dot.className = "dot" + (i === 1 ? " active" : "");
        dot.onclick = () => changeImage(i - 1);
        dotsContainer.appendChild(dot);
    }

    if (count > 1) {
        currentMediaIndex = 0;
        carouselTimer = setInterval(() => {
            currentMediaIndex = (currentMediaIndex + 1) % count;
            changeImage(currentMediaIndex);
        }, 2000); 
    }
}
function changeImage(index) {
    const images = document.querySelectorAll('.carousel-image'), dots =
        document.querySelectorAll('.dot');
    images.forEach((img, i) => img.classList.toggle('active', i === index));
    dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
    currentMediaIndex = index;
}

// === ORDER FLOW (V24 UPDATE: Simplified to single COD flow) ===
function handleBuyNow() {
    if (!currentProduct) return alert("Loading...");
    // V24: Directly show COD Order Form using the dynamic currentPrice
    showOrderForm(currentPrice, currentProduct['Product Name']);
}

function updateTotalPrice(itemPrice, qty) {
    if (isNaN(itemPrice)) itemPrice = 0;
    const totalPrice = (itemPrice * qty).toFixed(0);
    const priceDisplayElement = document.getElementById("total-price-display");
    const submitBtnElement = document.getElementById("order-form-submit-btn");

    if (priceDisplayElement) priceDisplayElement.textContent = `₹${totalPrice}`;
    if (submitBtnElement) submitBtnElement.textContent = `Place COD Order (₹${totalPrice})`;

    return totalPrice;
}

function changeQty(delta) {
    const qtyInput = document.getElementById("qty-input");
    const qtyDisplay = document.getElementById("qty-display");
    // Use currentPrice for calculation
    const itemPrice = currentPrice; 
    
    let currentQty = parseInt(qtyInput.value) || 1;
    let newQty = currentQty + delta;

    if (newQty < 1) newQty = 1;
    
    qtyInput.value = newQty;
    qtyDisplay.textContent = newQty;
    
    updateTotalPrice(itemPrice, newQty);
}

function showOrderForm(price, productName) {
// V24: Payment mode is fixed to COD
    const paymentMode = "COD"; 
    const senderName = document.getElementById("receiver-display-top").textContent || "Direct";
    const itemPrice = parseFloat(price);
    let currentQty = 1;
    const totalPrice = updateTotalPrice(itemPrice, currentQty);

    document.getElementById("modal-body").dataset.itemPrice = itemPrice; 

    showModal(`
<h3 style="color: var(--color-primary-btn);">Cash on Delivery (COD) Order Form</h3>
<p style="font-weight: 700; margin-bottom: 15px; text-align: center;">Total Price: <span id="total-price-display">₹${totalPrice}</span></p>

<form id="order-form" onsubmit="submitOrder(event, '${itemPrice}', '${paymentMode}', '${senderName}', '${productName}'); return false;">
    
    <div class="form-group-qty">
        <label>1. Quantity</label>
        <div class="qty-control">
            <button type="button" class="qty-btn" onclick="changeQty(-1)">-</button>
            <span id="qty-display">${currentQty}</span>
            <button type="button" class="qty-btn" onclick="changeQty(1)">+</button>
            <input type="hidden" name="Quantity" id="qty-input" value="${currentQty}">
        </div>
    </div>

    <input type="text" name="Full Name" placeholder="2. Full Name *" required autocomplete="name">
    <input type="text" name="Whatsapp Number" placeholder="3. WhatsApp (10 digits) *" pattern="[6-9][0-9]{9}" required autocomplete="tel">
    <input type="email" name="Email" placeholder="4. Email (Optional)" autocomplete="email">
    <input type="text" name="Area / Locality" placeholder="5. Area / Locality *" required>
    <input type="text" name="Landmark / Road Name" placeholder="6. Landmark / Road Name *" required>
    <input type="text" name="Village / Town" placeholder="7. Village / Town *" required>
    <input type="text" name="Taluka / Block" placeholder="8. Taluka / Block *" required>
    <input type="text" name="District" placeholder="9. District *" required>
    <input type="text" name="State" placeholder="10. State *" required>
    <input type="text" name="Pincode" placeholder="11. Pincode (6 digits) *" pattern="[0-9]{6}" required autocomplete="postal-code">

    <button type="submit" id="order-form-submit-btn" class="primary-btn btn-base">Place COD Order (₹${totalPrice})</button>
</form>
`);
    setTimeout(() => {
        const nameInput = document.querySelector('#order-form input[name="Full Name"]');
        if (nameInput) nameInput.focus();
    }, 100);
}

function submitOrder(event, itemPrice, paymentMode, senderName, productName) {
    event.preventDefault();
    const form = document.getElementById("order-form");
    const formData = new FormData(form);
    
    const qty = parseInt(document.getElementById("qty-input").value);
    const totalPrice = updateTotalPrice(itemPrice, qty);

    const data = {
        "Product Name": productName, 
        "Price": totalPrice,
        "Quantity": qty, 
        "Payment Mode": paymentMode,
        "Wish Sender": senderName,
        "Order Time": new Date().toLocaleString()
    };
    
    formData.forEach((value, key) => { data[key] = value; });
    
    finalSubmitOrder(data);
}

function finalSubmitOrder(data) {
    if (typeof data === 'string') data = JSON.parse(data);
    document.getElementById("modal-body").innerHTML = `
<h3 style="color: var(--color-primary-btn);">
<span class="loading-spinner"></span> Processing...
</h3>
<p>Please wait...</p>
`;
    const params = new URLSearchParams();
    data["Payment Status"] = "COD_CONFIRMED"; 
    data["Actual Price"] = isOfferExpired ? "999" : "799"; // Log actual offer status

    for (const key in data) params.append(key, data[key]);
    
    fetch(CONFIG.ORDER_SUBMIT_API, { method: "POST", body: params })
        .then(response => response.json())
        .then(result => {
            if (result.result === "success") {
                const customerName = data["Full Name"] || "Customer";
                document.getElementById("modal-body").innerHTML = `
<h3 style="color: var(--color-primary-btn);">🎉 Order Placed!</h3>
<p style="margin-bottom: 20px;">Your COD order is confirmed! We'll contact you on WhatsApp.</p>
<button class="primary-btn btn-base"
style="background: linear-gradient(135deg, #25D366, #128C7E);"
onclick="hideModal(); showPostPurchaseShareModal('${customerName}');">
📤 Share with Friends
</button>
`;
            } else {
                throw new Error(result.error || "Error");
            }
        })
        .catch(error => {
            console.error("Error submitting order:", error);
            document.getElementById("modal-body").innerHTML = `
<h3 style="color: var(--color-price-flash);">❌ Failed</h3>
<p>Network error or API failure. Please try again.</p>
<button class="primary-btn btn-base" onclick="hideModal();">Close</button>
`;
        });
}
function showPostPurchaseShareModal(senderName) {
    showModal(`
<h3 style="color: var(--color-primary-btn); text-align: center;">🎉 Thank You!</h3>
<p style="margin-bottom: 15px; text-align: center; font-weight: 600;">Share this deal with
friends!</p>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;">
<label style="font-weight: 600; color: #666;">Your Name:</label>
<input type="text" id="modal-share-sender-input" value="${senderName}" readonly
style="background: #f0f0f0; font-weight: bold; text-align: center; padding: 10px; border: 1px solid
#ddd; border-radius: 6px;">
<label style="font-weight: 600; color: #666;">Friend's Name:</label>
<input type="text" id="modal-share-receiver-input" value="Ram" placeholder="Friend Name"
style="border: 2px solid var(--color-primary-btn); text-align: center; padding: 10px; border-radius:
6px;">
<button class="primary-btn btn-base"
style="background: linear-gradient(135deg, #25D366, #128C7E); margin-top: 10px;"
onclick="handleShareFromModal();">
📤 Share Now!
</button>
</div>
`);
}
function handleShareFromModal() {
    const senderName = document.getElementById("modal-share-sender-input").value.trim();
    const receiverName = document.getElementById("modal-share-receiver-input").value.trim();
    if (!senderName || !receiverName || receiverName === "Friend Name") {
        alert("Please enter friend's name!");
        return;
    }
    hideModal();
    initiateWhatsAppShare(CONFIG.BASE_STORE_URL, senderName, receiverName, true);
}
function handleShare() {
    const senderName = document.getElementById("share-sender-input").value.trim();
    const receiverName = document.getElementById("share-receiver-input").value.trim();
    if (!senderName || senderName === "Your Name") {
        alert("कृपया अपना नाम डालें!");
        return;
    }
    if (!receiverName || receiverName === "Friend Name") {
        alert("कृपया दोस्त का नाम डालें!");
        return;
    }
    initiateWhatsAppShare(CONFIG.BASE_STORE_URL, senderName, receiverName, false);
}

// === FINAL WHATSAPP SHARE LOGIC (Same as V23) ===
function initiateWhatsAppShare(baseShareUrl, senderName, receiverName, isBought) {
    let finalShareUrl = baseShareUrl;
    if (isBought) {
        finalShareUrl = baseShareUrl + `?sender=${encodeURIComponent(receiverName)}&status=bought`;
    } else {
        finalShareUrl = baseShareUrl + `?sender=${encodeURIComponent(receiverName)}`;
    }
    
    // V25: Changed wish text to a generic one
    const customWishText = `🎁 Best Wishes! आपके लिए एक exclusive gift offer है। इसे मिस न करें! 🥳`;

    const shareText = `*${senderName.toUpperCase()}*\n\n${customWishText}\n\n${finalShareUrl}`;
    
    if (navigator.share) {
        navigator.share({ text: shareText, url: finalShareUrl })
            .catch(() => window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, "_blank"));
    } else {
        window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, "_blank");
    }
}

// === INITIALIZATION ===
function init() {
    fetchProductData();
    document.getElementById("buy-now-btn").addEventListener("click", handleBuyNow);
    document.getElementById("share-btn").addEventListener("click", handleShare);
    document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target.id === "modal") hideModal();
    });
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
