<script>
// === CONFIGURATION (FINAL AND CORRECT) ===
const CONFIG = {
    // 💡 IMPORTANT: Replace this with your DEPLOYED Apps Script URL
    ORDER_SUBMIT_API:
        "https://script.google.com/macros/s/AKfycbyQ8aX14aMNpFGQJJJkqmAEkpie1U6fgdxsyGK2Mx4pHpZTZklzWl50fxG00hSKyr7e2Q/exec", 
    ADMIN_WHATSAPP: "919226949557",
    // 💡 BASE URL: Your Final GitHub Pages URL
    BASE_STORE_URL: "https://genzygifts.github.io/GenzyGifts/",
    PRODUCT_JSON_FILE: "product_data.json"
};

let currentProduct = null, audioPlayed = false, carouselTimer = null, currentMediaIndex = 0;
let currentVideo = null; 

// === UTILITY FUNCTIONS ===
function checkKey(e) {
    if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 83))
        || (e.ctrlKey && e.keyCode === 85)) {
        e.preventDefault();
        return false;
    }
    if (e.key === 'Escape') hideModal();
    return true;
}
function getUrlParams() {
    const params = {};
    window.location.search.substring(1).split("&").forEach(pair => {
        const [key, value] = pair.split("=").map(decodeURIComponent);
        if (key) params[key] = value;
    });
    return params;
}
function showModal(content) {
    document.getElementById("modal-body").innerHTML = content;
    document.getElementById("modal").classList.remove("hidden");
}
function hideModal() {
    document.getElementById("modal").classList.add("hidden");
}

// === TIMER & PRICE LOGIC (MODIFIED) ===
function startCountdown() {
    const TIMER_KEY = 'diwali_offer_timer';
    let countDownDate;
    const saved = localStorage.getItem(TIMER_KEY);
    
    // Check if the saved time is too old (e.g., > 24 hours), then reset.
    const now = new Date().getTime();
    if (saved && (now - parseInt(saved)) > 24 * 60 * 60 * 1000) {
        localStorage.removeItem(TIMER_KEY);
        countDownDate = null;
    }

    if (saved) {
        countDownDate = parseInt(saved);
    } else {
        // Offer time starts random between 10 to 15 minutes
        const minutes = Math.floor(Math.random() * 6) + 10;
        countDownDate = now + minutes * 60 * 1000;
        localStorage.setItem(TIMER_KEY, countDownDate.toString());
    }
    
    const countdownElement = document.getElementById("countdown");
    const buyBtn = document.getElementById("buy-now-btn");
    const actualPriceEl = document.getElementById("price-cod-display"); // Actual Price Container
    const offerPriceEl = document.getElementById("price-premium-display"); // Offer Price Container
    
    // Prices fetched from JSON
    const actualPrice = parseFloat(currentProduct.COD_Price || "1150"); 
    const offerPrice = parseFloat(currentProduct.Premium_Price || "999"); 

    const x = setInterval(() => {
        const now = new Date().getTime(), distance = countDownDate - now;
        
        // Timer Logic
        if (distance < 0) {
            clearInterval(x);
            countdownElement.innerHTML = "EXPIRED!";
            
            // Offer Expired: Show only Actual Price, Offer Price strikethrough is hidden
            if (actualPriceEl) {
                actualPriceEl.textContent = `₹${actualPrice}`; // Actual Price (no strikethrough)
                actualPriceEl.style.textDecoration = 'none';
                actualPriceEl.style.color = 'var(--color-price-premium)'; // Use offer price color for main price
                actualPriceEl.style.fontSize = '20px';
                actualPriceEl.style.opacity = '1';
                actualPriceEl.style.fontWeight = '900';
            }
            if (offerPriceEl) offerPriceEl.style.display = 'none';
            
            if (buyBtn) {
                buyBtn.textContent = `🛒 Buy Now ₹${actualPrice}`;
                buyBtn.disabled = false;
            }
            // Do NOT remove TIMER_KEY here, keep it expired until manually reset
            return;
        }

        // Timer Active: Show Offer Price as main, Actual Price as strikethrough
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);
        countdownElement.innerHTML = (hours < 10 ? "0" + hours : hours) + "H : " + (minutes < 10 ?
            "0" + minutes : minutes) + "M : " + (seconds
                < 10 ? "0" + seconds : seconds) + "S";
        
        // Ensure both prices are visible when timer is active
        if (offerPriceEl) {
             offerPriceEl.textContent = `₹${offerPrice}`;
             offerPriceEl.style.display = 'inline-block';
        }
        if (actualPriceEl) {
            actualPriceEl.textContent = `₹${actualPrice}`;
            actualPriceEl.style.display = 'inline-block';
            actualPriceEl.style.textDecoration = 'line-through';
            actualPriceEl.style.color = '#666';
            actualPriceEl.style.fontSize = '14px';
            actualPriceEl.style.opacity = '0.7';
            actualPriceEl.style.fontWeight = '500';
        }

        if (buyBtn) {
            buyBtn.textContent = `🛒 Buy Now ₹${offerPrice}`;
            buyBtn.disabled = false;
        }

    }, 1000);
}

// === AUDIO LOGIC (Unchanged) ===
function generateTtsUrl(receiverName, senderName) {
    const TTS_ENDPOINT =
        "https://corsproxy.io/?https://translate.google.com/translate_tts?ie=UTF-8&tl=hi&client=tw-ob&q=";
    const params = getUrlParams(), shareStatus = params.status;
    let ttsMessage;

    if (shareStatus === "bought") {
        ttsMessage = `नमस्ते${receiverName}! आपके दोस्त ${senderName} ने भी इसे अभी-अभी order किया है।`;
    } else if (params.sender && "Priya" !== params.sender) { 
        ttsMessage = `नमस्ते${receiverName}! ${senderName} की ओर से यह special offer आपके लिए है।`;
    } else {
        ttsMessage = `नमस्ते${receiverName}! अपना name डालके Wish share करें।`;
    }
    return TTS_ENDPOINT + encodeURIComponent(ttsMessage);
}

function playAudio(receiverName) {
    if (audioPlayed || !currentProduct) return;
    const params = getUrlParams(), senderName = params.sender || "Priya"; 
    const audio = document.getElementById("tts-audio");
    audio.src = generateTtsUrl(receiverName, senderName);
    
    audio.onended = () => { 
        audioPlayed = true;
        if (currentVideo) {
            currentVideo.muted = false;
            currentVideo.play().catch(e => console.warn("Video auto-play failed after TTS:", e));
        }
    };
    
    audio.play().catch(() => { 
        audioPlayed = false;
        setTimeout(() => {
            if (currentVideo) {
                currentVideo.muted = false;
                currentVideo.play().catch(e => console.warn("Video auto-play failed (TTS fail delay):", e));
            }
        }, 3000); 
    });
}

function playAudioManually() {
    const params = getUrlParams();
    const receiverName = params.sender ? decodeURIComponent(params.sender) : "Priya";
    audioPlayed = false;
    playAudio(receiverName);
}

// === FETCH PRODUCT DATA ===
async function fetchProductData() {
    try {
        const response = await fetch(CONFIG.PRODUCT_JSON_FILE);
        if (!response.ok) throw new Error("Failed to fetch product_data.json. Check file path on GitHub.");
        const data = await response.json();
        currentProduct = data;
        updateStoreUI();
    } catch (error) {
        console.error("Error fetching product data:", error);
        document.getElementById("product-name-static").textContent = "DATA ERROR: Product Not Found";
        document.getElementById("buy-now-btn").textContent = "Error";
        document.getElementById("buy-now-btn").disabled = true;
    }
}
// === UPDATE STORE UI ===
function updateStoreUI() {
    if (!currentProduct) return;
    const params = getUrlParams(), finalReceiverName = params.sender ?
        decodeURIComponent(params.sender) : "Priya";
    
    document.getElementById("receiver-display-top").textContent = finalReceiverName;
    
    // FETCHING data directly from currentProduct
    document.getElementById("product-name-static").textContent = currentProduct["Product Name"] || "Diwali Gift Box";
    
    // Set both Actual and Offer prices for initial display
    const offerPrice = currentProduct.Premium_Price || "999";
    const actualPrice = currentProduct.COD_Price || "1150";

    document.getElementById("price-premium").textContent = offerPrice; // Offer Price
    document.getElementById("price-cod").textContent = actualPrice; // Actual Price (for strikethrough)
    
    const ratingText = currentProduct.rating || "4.5";
    const reviewCount = currentProduct.reviews || 0;
    const reviewBar = document.querySelector('#review-bar .review-count');
    if(reviewBar) reviewBar.textContent = `(${reviewCount} Reviews | ${ratingText}/5)`;
    
    const descText = currentProduct.Description || "Experience the joy...";
    document.getElementById("description-text").textContent = descText;

    // Button text will be set by startCountdown for accurate price display
    document.getElementById("buy-now-btn").disabled = false;
    
    startMediaDisplay();
    startCountdown();
    setTimeout(() => { if (!audioPlayed) playAudio(finalReceiverName); }, 1000);
}
// === MEDIA DISPLAY (Unchanged) ===
function startMediaDisplay() {
    const mediaContainer = document.getElementById("media-carousel"), dotsContainer =
        document.getElementById("carousel-dots");
    mediaContainer.innerHTML = "";
    dotsContainer.innerHTML = "";
    clearInterval(carouselTimer);
    
    const mediaCount = parseInt(currentProduct.Media_Count || 0);
    const hasVideo = currentProduct.Has_Video === true;

    if (hasVideo && mediaCount > 0) {
        const video = document.createElement("video");
        video.src = "1.mp4"; // Assumes 1.mp4 is available
        video.className = "product-media-video";
        video.setAttribute("loop", "");
        video.setAttribute("autoplay", "");
        video.setAttribute("playsinline", "");
        video.setAttribute("muted", ""); 
        
        currentVideo = video; 

        video.onerror = () => { 
            console.warn("Video failed to load.");
            video.remove(); 
            startImageCarousel(mediaCount, mediaContainer, dotsContainer); 
        };
        
        mediaContainer.appendChild(video);
    } else if (mediaCount > 0) {
        startImageCarousel(mediaCount, mediaContainer, dotsContainer);
    } else {
        mediaContainer.innerHTML = '<div class="media-loading">🖼️</div>'; 
    }
}

function toggleMediaPlay() {
    if (document.getElementById("tts-audio").played.length > 0 && !document.getElementById("tts-audio").paused) {
        document.getElementById("tts-audio").pause();
        audioPlayed = true; 
    }
    
    if (currentVideo) {
        if (currentVideo.paused) {
            currentVideo.muted = false; 
            currentVideo.play().catch(e => console.error("Video play failed on click:", e));
        } else {
            currentVideo.pause();
        }
    }
}

function startImageCarousel(count, container, dotsContainer) {
    for (let i = 1; i <= count; i++) {
        const img = document.createElement("img");
        img.className = "carousel-image";
        img.src = `${i}.jpg`; // Assumes 1.jpg, 2.jpg, etc.
        if (i === 1) img.classList.add('active');
        container.appendChild(img);
        
        const dot = document.createElement("div");
        dot.className = "dot" + (i === 1 ? " active" : "");
        dot.onclick = () => changeImage(i - 1);
        dotsContainer.appendChild(dot);
    }

    if (count > 1) {
        currentMediaIndex = 0;
        carouselTimer = setInterval(() => {
            currentMediaIndex = (currentMediaIndex + 1) % count;
            changeImage(currentMediaIndex);
        }, 3000);
    }
}
function changeImage(index) {
    const images = document.querySelectorAll('.carousel-image'), dots =
        document.querySelectorAll('.dot');
    images.forEach((img, i) => img.classList.toggle('active', i === index));
    dots.forEach((dot, i) => dot.classList.toggle('active', i === index));
    currentMediaIndex = index;
}

// === ORDER FLOW (Quantity & Form Logic) ===

// Global function for Quantity control in modal
window.updateQuantity = (change, basePrice) => {
    let current = parseInt(document.getElementById('quantity-hidden').value);
    let newQty = current + change;
    if (newQty < 1) newQty = 1;
    
    const finalPrice = (basePrice * newQty).toFixed(0);

    document.getElementById('quantity-display').textContent = newQty;
    document.getElementById('quantity-hidden').value = newQty;
    document.getElementById('price-hidden').value = finalPrice;
    document.getElementById('final-price-display').textContent = finalPrice;
    document.getElementById('place-order-btn').textContent = `Place Order (₹${finalPrice})`;
};

function handleBuyNow() {
    if (!currentProduct) return alert("Loading...");

    const countdownEl = document.getElementById("countdown");
    const isOfferActive = countdownEl.innerHTML !== "EXPIRED!";
    
    const priceToPay = isOfferActive 
        ? (currentProduct.Premium_Price || "999") 
        : (currentProduct.COD_Price || "1150"); 
    
    // Payment mode is ALWAYS COD as per requirement
    const paymentMode = "COD"; 

    // Add extra tracking context for the price paid
    const priceContext = isOfferActive ? "OFFER_PRICE" : "ACTUAL_PRICE";

    showOrderForm(priceToPay, paymentMode, priceContext);
}

function showOrderForm(price, paymentMode, priceContext) {
    const basePrice = parseFloat(price);
    let currentPrice = basePrice;
    let currentQuantity = 1;
    
    const modalContent = `
<h3 style="color: var(--color-primary-btn);">Complete Order</h3>
<p style="font-weight: 700; margin-bottom: 15px; text-align: center;">You pay: ₹<span id="final-price-display">${currentPrice}</span> (Payment Mode: ${paymentMode})</p>
<form id="order-form" onsubmit="submitOrder(event, '${paymentMode}', '${priceContext}'); return false;">
    
    <div class="quantity-control">
        <span>Quantity:</span>
        <button type="button" class="quantity-btn" onclick="updateQuantity(-1, ${basePrice});">-</button>
        <span id="quantity-display">${currentQuantity}</span>
        <button type="button" class="quantity-btn" onclick="updateQuantity(1, ${basePrice});">+</button>
        <input type="hidden" name="Quantity" id="quantity-hidden" value="${currentQuantity}">
        <input type="hidden" name="Price" id="price-hidden" value="${currentPrice}">
        <input type="hidden" name="Payment Mode" value="${paymentMode}"> 
    </div>
    <input type="text" name="Full Name" placeholder="Full Name *" required autocomplete="name">
    <input type="text" name="Whatsapp No" placeholder="WhatsApp No. (10 digits) *"
        pattern="[6-9][0-9]{9}" required autocomplete="tel">
    <input type="email" name="Email" placeholder="Email (For Invoice) *" required autocomplete="email">
    <input type="text" name="Area/Locality" placeholder="Area/Locality *" required>
    <input type="text" name="Village" placeholder="Village *" required>
    <input type="text" name="Landmark/Road" placeholder="Landmark/Road *" required>
    <input type="text" name="Taluka/City" placeholder="Taluka/City *" required>
    <input type="text" name="Dist" placeholder="Dist *" required>
    <input type="text" name="State" placeholder="State *" required>
    <input type="text" name="Pincode" placeholder="Pincode (6 digits) *" pattern="[0-9]{6}" required>
    
    <button type="submit" id="place-order-btn" class="primary-btn btn-base">Place Order (₹${currentPrice})</button>
</form>
`;
    showModal(modalContent);
}

function submitOrder(event, paymentMode, priceContext) {
    event.preventDefault();
    
    const form = document.getElementById("order-form");
    const formData = new FormData(form);
    
    const price = document.getElementById('price-hidden').value; 
    const quantity = document.getElementById('quantity-hidden').value;
    const senderName = document.getElementById("receiver-display-top").textContent || "Direct";
    
    // Generate Order ID, Date, Day, Time
    const now = new Date();
    const orderId = 'ORD-' + now.getTime().toString().slice(-6) + Math.floor(Math.random() * 100);

    // Create the final data object for submission
    const data = {
        "Date": now.toLocaleDateString('en-IN'),
        "Day": now.toLocaleDateString('en-IN', { weekday: 'long' }),
        "Time": now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        "Order Id": orderId,
        "Product Name": currentProduct["Product Name"] || "Unknown", 
        "Price": price,
        "Quantity": quantity,
        "Payment Mode": paymentMode, 
        "Price Context": priceContext, // Added for tracking
        "Wish Sender": senderName,
    };
    
    // Map form data to the final data object keys
    // NOTE: Key names are updated here to match Google Sheet columns
    formData.forEach((value, key) => { 
        data[key] = value;
    });
    
    // Re-map keys to ensure exact match with Google Sheet
    data["Full Name"] = formData.get("Full Name");
    data["Whatsapp No"] = formData.get("Whatsapp No");
    data["Email"] = formData.get("Email");
    data["Area/Locality"] = formData.get("Area/Locality");
    data["Village"] = formData.get("Village");
    data["Landmark/Road"] = formData.get("Landmark/Road");
    data["Taluka/City"] = formData.get("Taluka/City");
    data["Dist"] = formData.get("Dist");
    data["State"] = formData.get("State");
    data["Pincode"] = formData.get("Pincode");


    finalSubmitOrder(data);
}

function finalSubmitOrder(data) {
    if (typeof data === 'string') data = JSON.parse(data);
    
    // Add columns in the required sequence for Google Sheet.
    // The Apps Script will handle the order and the extra fields not in form.
    const submitData = {
        "Date": data["Date"],
        "Day": data["Day"],
        "Time": data["Time"],
        "Order Id": data["Order Id"],
        "Full Name": data["Full Name"],
        "Whatsapp No": data["Whatsapp No"],
        "Email": data["Email"],
        "Area/Locality": data["Area/Locality"],
        "Village": data["Village"],
        "Landmark/Road": data["Landmark/Road"],
        "Taluka/City": data["Taluka/City"],
        "Dist": data["Dist"],
        "State": data["State"],
        "Pincode": data["Pincode"],
        "Product Name": data["Product Name"],
        "Price": data["Price"],
        "Payment Mode": data["Payment Mode"],
        "Price Context": data["Price Context"], 
        "Quantity": data["Quantity"]
    };

    document.getElementById("modal-body").innerHTML = `
<h3 style="color: var(--color-primary-btn);">
<span class="loading-spinner"></span> Processing...
</h3>
<p>Please wait...</p>
`;
    const params = new URLSearchParams();
    for (const key in submitData) params.append(key, submitData[key]);
    
    // Log the structure being sent for debugging
    console.log("Submitting Data:", submitData); 

    fetch(CONFIG.ORDER_SUBMIT_API, { method: "POST", body: params })
        .then(response => response.json())
        .then(result => {
            if (result.result === "success") {
                const customerName = data["Full Name"] || "Customer";
                const customerEmail = data["Email"] || "N/A";
                
                // Show Post-Purchase Share Modal
                hideModal();
                showPostPurchaseShareModal(customerName, customerEmail);
                
            } else {
                throw new Error(result.error || "Error");
            }
        })
        .catch(error => {
            console.error("Error submitting order:", error);
            document.getElementById("modal-body").innerHTML = `
<h3 style="color: var(--color-price-cod);">❌ Failed</h3>
<p>Network error or API failure. Please try again. (Check console for error)</p>
<button class="primary-btn btn-base" onclick="hideModal();">Close</button>
`;
        });
}
function showPostPurchaseShareModal(senderName, customerEmail) {
    showModal(`
<h3 style="color: #25D366; text-align: center;">🎉 Order Placed Successfully!</h3>
<p style="margin-bottom: 20px; text-align: center; font-weight: 600;">Invoice sent to: <strong>${customerEmail}</strong></p>
<h4 style="color: var(--color-primary-btn); text-align: center; margin-bottom: 15px;">🎁 Share Wish with Friends!</h4>
<div style="display: flex; flex-direction: column; gap: 12px;">
<label style="font-weight: 600; color: #666;">Your Name:</label>
<input type="text" id="modal-share-sender-input" value="${senderName}" readonly
style="background: #f0f0f0; font-weight: bold; text-align: center; padding: 10px; border: 1px solid
#ddd; border-radius: 6px;">
<label style="font-weight: 600; color: #666;">Friend's Name:</label>
<input type="text" id="modal-share-receiver-input" value="Ram" placeholder="Friend Name"
style="border: 2px solid var(--color-primary-btn); text-align: center; padding: 10px; border-radius:
6px;">
<button class="primary-btn btn-base"
style="background: linear-gradient(135deg, #25D366, #128C7E); margin-top: 10px;"
onclick="handleShareFromModal();">
📤 Share Now!
</button>
</div>
`);
}
function handleShareFromModal() {
    const senderName = document.getElementById("modal-share-sender-input").value.trim();
    const receiverName = document.getElementById("modal-share-receiver-input").value.trim();
    if (!senderName || !receiverName || receiverName === "Friend Name") {
        alert("कृपया दोस्त का नाम डालें!");
        return;
    }
    hideModal();
    initiateWhatsAppShare(CONFIG.BASE_STORE_URL, senderName, receiverName, true);
}
function handleShare() {
    const senderName = document.getElementById("share-sender-input").value.trim();
    const receiverName = document.getElementById("share-receiver-input").value.trim();
    if (!senderName || senderName === "Your Name") {
        alert("कृपया अपना नाम डालें!");
        return;
    }
    if (!receiverName || receiverName === "Friend Name") {
        alert("कृपया दोस्त का नाम डालें!");
        return;
    }
    initiateWhatsAppShare(CONFIG.BASE_STORE_URL, senderName, receiverName, false);
}

// === FINAL WHATSAPP SHARE LOGIC (Exact Preview) ===
function initiateWhatsAppShare(baseShareUrl, senderName, receiverName, isBought) {
    let finalShareUrl = baseShareUrl;
    if (isBought) {
        finalShareUrl = baseShareUrl + `?sender=${encodeURIComponent(receiverName)}&status=bought`;
    } else {
        finalShareUrl = baseShareUrl + `?sender=${encodeURIComponent(receiverName)}`;
    }
    
    // 1. EXACT WISHING TEXT
    const customWishText = `।। ⛄🥰आपको और आपके परिवार को मेरी ओर से शुभ दीपावली 🎁🌷।।\nमां लक्ष्मी और गणेश जी की कृपा आप पर सदा बनी रहे 🌺🙏 ।।`;

    // 2. BOLD SENDER NAME + WISH TEXT + LIVE URL (Triggers the custom preview card)
    const shareText = `*${senderName.toUpperCase()}*\n\n${customWishText}\n\n${finalShareUrl}`;
    
    if (navigator.share) {
        navigator.share({ text: shareText, url: finalShareUrl })
            .catch(() => window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, "_blank"));
    } else {
        window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, "_blank");
    }
}

// === INITIALIZATION ===
function init() {
    fetchProductData();
    document.getElementById("buy-now-btn").addEventListener("click", handleBuyNow);
    document.getElementById("share-btn").addEventListener("click", handleShare);
    document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target.id === "modal") hideModal();
    });
}
document.addEventListener("DOMContentLoaded", init);
</script>
