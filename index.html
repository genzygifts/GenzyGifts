<style>
/* --- STYLES (V22 - Final Compact & Functional Layout) --- */
:root {
/* Final Professional Minimal Colors */
--color-bg-dark: #f0f0ff; 
--color-bg-light: #ffffff; 
--color-card-bg: #ffffff;
--color-primary-text: #333333;
--color-primary-btn: #007bff; /* Primary Blue */
--color-primary-btn-hover: #0056b3;
--color-price-cod: #D32F2F; /* Red for Price */
--color-gold: #FFC107;
--color-brown: #555555; 
--color-whatsapp: #25D366;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Poppins', sans-serif;
-webkit-tap-highlight-color: transparent;
}
html, body { 
    width: 100%; min-height: 100vh; background: #e9e9e9; display: flex; justify-content: center;
}
#app-container { 
    width: 100%; max-width: 450px; margin: 0 auto; display: flex; flex-direction: column; 
    background: var(--color-bg-dark); box-shadow: 0 0 20px rgba(0, 0, 0, 0.1); 
    color: var(--color-primary-text); position: relative; overflow-x: hidden; padding-bottom: 60px; 
}
#top-header-wish { text-align: center; padding: 10px 0 5px 0; color: var(--color-primary-text); font-weight: 600; position: sticky; top: 0; z-index: 50; background: var(--color-bg-light); border-bottom: 1px solid #ddd; }
.receiver-header { font-size: 20px; font-weight: 900; color: var(--color-primary-btn); margin-bottom: 2px; }
.festival-text { font-size: 12px; margin: 2px 0; display: flex; justify-content: center; align-items: center; gap: 5px; color: var(--color-brown); }

#content-area { padding: 0 10px; flex-grow: 1; display: flex; flex-direction: column; }

#product-card { 
    background-color: var(--color-card-bg); border-radius: 10px; padding: 8px; margin: 8px 0; 
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); text-align: left; flex-shrink: 0; border: 1px solid #ddd; 
    position: relative; 
}
.product-name-main { font-size: 1.1rem; font-weight: 900; color: #000; margin: 0 0 5px 0; }

/* V22: Dynamic Media Aspect Ratio Container */
#media-box-wrapper {
    position: relative;
    width: 100%;
    padding-top: 100%; /* Default 1:1, overridden by JS for 9:16 */
    overflow: hidden; 
    border-radius: 6px; 
    background: #f0f0f0; 
    margin-bottom: 8px;
}
#media-box {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
}
.carousel-image, #product-video { 
    width: 100%; height: 100%; object-fit: cover; transition: opacity 0.5s; display: none; 
}
#product-video { object-fit: cover; position: absolute; top: 0; left: 0; }
.carousel-image.active { display: block; }

/* Price and Timer Styles */
#price-section { display: flex; align-items: baseline; gap: 8px; }
.price-actual { font-size: 0.9rem; color: #757575; text-decoration: line-through; font-weight: 500; }
.price-offer { font-size: 1.5rem; color: var(--color-price-cod); font-weight: 900; }

#timer-below-price { padding: 4px 8px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: center; align-items: center; background: #fffde7; border: 1px dashed var(--color-gold); }
#timer-below-price .label { font-weight: 600; color: var(--color-brown); margin-right: 6px; font-size: 0.8rem; }
#timer-below-price .time { font-size: 1.2rem; font-weight: 900; color: var(--color-price-cod); }

/* V22: Smaller CTA Button */
.primary-btn {
    padding: 10px; 
    font-size: 1.1rem; 
    font-weight: 700;
    width: 100%;
    background: var(--color-primary-btn);
    color: white; 
    border: none;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 3px 0 0 var(--color-primary-btn-hover);
    transition: all 0.1s ease;
    margin-top: 8px; 
}
.primary-btn:active {
    box-shadow: 0 0 0 0 var(--color-primary-btn-hover);
    transform: translateY(3px);
}
/* WhatsApp Floating Button (V22) */
#floating-whatsapp {
    position: fixed; 
    right: calc(50% - min(50vw, 225px) + 15px); 
    bottom: 15px; 
    background-color: var(--color-whatsapp); 
    color: white; 
    width: 55px; 
    height: 55px;
    border-radius: 50%; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    font-size: 30px; 
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5); 
    z-index: 1000; 
    text-decoration: none;
}
/* Form Group for Order Modal (Required for JS) */
.form-group-qty { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.qty-control { display: flex; align-items: center; gap: 10px; }
.qty-btn { background: #eee; border: 1px solid #ccc; width: 30px; height: 30px; border-radius: 4px; }
input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; }
</style>
</head>

<script>
// === CONFIGURATION ===
const CONFIG = {
    ORDER_SUBMIT_API: "https://script.google.com/macros/s/AKfycbw9benSD2ZQN3ElLygSyZdoByy7FSiAplJ7Pcaa9QwZcFPVFrqgJvMmSlTyoI6NGff/exec",
    ADMIN_WHATSAPP: "919226949557",
    BASE_STORE_URL: "https://genzygifts.github.io/GenzyGifts/",
    PRODUCT_JSON_FILE: "product_data.json", 
    LIVE_ORDERS: [
        { name: "Suresh", city: "Mumbai" },
        { name: "Pooja", city: "Pune" },
        { name: "Rajat", city: "Delhi" },
        { name: "Neha", city: "Bangalore" },
        { name: "Amit", city: "Jaipur" }
    ]
};

let currentProduct = null, audioPlayed = false, carouselTimer = null, currentMediaIndex = 0;
let isOfferActive = true; 
let actualPrice = null; 
let offerPrice = null; 
let videoPlayer = null;
let isVideoPlaying = false;

// === CORE JS FUNCTIONS ===

function checkKey(e) { if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 83)) || (e.ctrlKey && e.keyCode === 85)) { e.preventDefault(); return false; } if (e.key === 'Escape') hideModal(); return true; }
function getUrlParams() { const params = {}; window.location.search.substring(1).split("&").forEach(pair => { const [key, value] = pair.split("=").map(decodeURIComponent); if (key) params[key] = value; }); return params; }
function showModal(content) { document.getElementById("modal-body").innerHTML = content; document.getElementById("modal").classList.remove("hidden"); }
function hideModal() { document.getElementById("modal").classList.add("hidden"); if(videoPlayer && isVideoPlaying) { videoPlayer.pause(); document.getElementById("video-play-pause-btn").innerHTML = '<i class="fas fa-play"></i>'; isVideoPlaying = false; } }

// V22 FIX: TIMER LOGIC
function startCountdown() { 
    const TIMER_KEY = 'diwali_offer_timer'; 
    let countDownDate; 
    const saved = localStorage.getItem(TIMER_KEY); 
    const isExpired = localStorage.getItem('isOfferExpired') === 'true'; 

    if (isExpired) { 
        isOfferActive = false; 
        document.getElementById("timer-below-price").style.display = 'none';
        updateStoreUI(); 
        return; 
    } 

    if (saved && parseInt(saved) > new Date().getTime()) { 
        countDownDate = parseInt(saved); 
    } else { 
        // 15 to 20 mins timer
        const minutes = Math.floor(Math.random() * 6) + 15; 
        countDownDate = new Date().getTime() + minutes * 60 * 1000; 
        localStorage.setItem(TIMER_KEY, countDownDate.toString()); 
    } 

    const countdownElement = document.getElementById("countdown");
    const timerBox = document.getElementById("timer-below-price");

    const x = setInterval(() => { 
        const now = new Date().getTime(), distance = countDownDate - now; 
        
        if (distance < 0) { 
            clearInterval(x); 
            countdownElement.textContent = "EXPIRED"; 
            timerBox.style.display = 'none';
            isOfferActive = false; 
            localStorage.setItem('isOfferExpired', 'true'); 
            localStorage.removeItem(TIMER_KEY); 
            updateStoreUI(); 
            return; 
        } 
        
        isOfferActive = true; 
        timerBox.style.display = 'flex';
        
        const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)); 
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)); 
        const seconds = Math.floor((distance % (1000 * 60)) / 1000); 
        
        countdownElement.textContent = 
            (hours < 10 ? "0" + hours : hours) + "H : " + 
            (minutes < 10 ? "0" + minutes : minutes) + "M : " + 
            (seconds < 10 ? "0" + seconds : seconds) + "S"; 
    }, 1000); 
}

function generateTtsUrl(receiverName, senderName) { const TTS_ENDPOINT = "https://corsproxy.io/?https://translate.google.com/translate_tts?ie=UTF-8&tl=hi&client=tw-ob&q="; const params = getUrlParams(), shareStatus = params.status; let ttsMessage; if (shareStatus === "bought" || shareStatus === "paid") { ttsMessage = `नमस्ते${receiverName}! आपके दोस्त ${senderName} ने भी यह जन्मदिन का special gift अभी-अभी order किया है।`; } else if (params.sender && "Priya" !== params.sender) { ttsMessage = `नमस्ते${receiverName}! ${senderName} की ओर से यह special birthday offer आपके लिए है।`; } else { ttsMessage = `नमस्ते${receiverName}! अपना name डालके Birthday Wish share करें।`; } return TTS_ENDPOINT + encodeURIComponent(ttsMessage); }
function playAudio(receiverName) { if (audioPlayed || !currentProduct) return; const params = getUrlParams(), senderName = params.sender || "Priya"; const audio = document.getElementById("tts-audio"); audio.src = generateTtsUrl(receiverName, senderName); audio.onended = () => { audioPlayed = true; }; audio.play().catch(() => { audioPlayed = false; }); }
function playAudioManually() { const params = getUrlParams(); const receiverName = params.sender ? decodeURIComponent(params.sender) : "Priya"; audioPlayed = false; playAudio(receiverName); }
function updateMetaTags(productName, price) { const titleTag = document.querySelector('meta[property="og:title"]'); if (titleTag) { titleTag.setAttribute('content', `${productName} | Offer Price ₹${price}`); } }

async function fetchProductData() {
    const buyBtn = document.getElementById("buy-now-btn");
    try {
        buyBtn.disabled = true; 
        const response = await fetch(CONFIG.PRODUCT_JSON_FILE);
        if (!response.ok) { throw new Error(`Failed to fetch product_data.json. Status: ${response.status}`); }
        const data = await response.json();
        if (!data || !data["Product Name"]) { throw new Error("JSON file is empty or missing 'Product Name'."); }
        currentProduct = data;
        actualPrice = currentProduct.COD_Actual_Price || "999";
        offerPrice = currentProduct.COD_Offer_Price || "799";
        startCountdown();
        updateStoreUI(); 
        startMediaDisplay();
        startLiveNotifications(); 
        const finalPrice = isOfferActive ? offerPrice : actualPrice;
        updateMetaTags(currentProduct["Product Name"] || "Birthday Gift Box", finalPrice);
        buyBtn.disabled = false; 
    } catch (error) {
        console.error("--- FATAL ERROR: product_data.json ---", error);
        document.getElementById("product-name-static").textContent = "DATA ERROR: Product Not Found";
        document.getElementById("description-text").textContent = "Please check product_data.json file path and content.";
        buyBtn.textContent = "Error Loading";
        buyBtn.disabled = true; 
    }
}
function updateStoreUI() {
    if (!currentProduct) return;
    const params = getUrlParams(), finalReceiverName = params.sender ? decodeURIComponent(params.sender) : "Priya";
    document.getElementById("receiver-display-top").textContent = finalReceiverName;
    document.getElementById("product-name-static").textContent = currentProduct["Product Name"] || "Birthday Gift Box";
    const priceActualDisplay = document.getElementById("price-actual-main");
    const priceOfferDisplay = document.getElementById("price-offer-main");
    const offerLabel = document.querySelector('.offer-text-label');
    const actualPriceElement = document.querySelector('.price-actual');
    const timerBox = document.getElementById("timer-below-price");
    priceActualDisplay.textContent = actualPrice;
    priceOfferDisplay.textContent = isOfferActive ? offerPrice : actualPrice;
    if (isOfferActive) {
        actualPriceElement.style.display = 'inline-block';
        offerLabel.textContent = 'OFFER!';
        timerBox.style.display = 'flex';
    } else {
        actualPriceElement.style.display = 'none';
        offerLabel.textContent = 'ACTUAL PRICE';
        timerBox.style.display = 'none';
    }
    document.getElementById("description-text").textContent = currentProduct.Description || "Experience the joy...";
    document.getElementById("buy-now-btn").textContent = `🎁 Buy Now (COD Available)`;
    const reviewBar = document.querySelector('#review-bar .review-count');
    if(reviewBar) reviewBar.textContent = `(${currentProduct.reviews || 0} Reviews | ${currentProduct.rating || 4.5}/5)`;
    const waLink = `https://wa.me/${CONFIG.ADMIN_WHATSAPP}?text=Hi! I am interested in the ${currentProduct["Product Name"]}`;
    document.getElementById("floating-whatsapp").href = waLink;
    setTimeout(() => { if (!audioPlayed) playAudio(finalReceiverName); }, 1000);
}

// V22 FIX: MEDIA DISPLAY LOGIC FOR ASPECT RATIO
function startMediaDisplay() { 
    if (!currentProduct || !currentProduct.Media_URLs || currentProduct.Media_URLs.length === 0) { console.error("No media URLs found in product data."); return; }
    
    const mediaWrapper = document.getElementById("media-box-wrapper");
    const mediaContainer = document.getElementById("media-carousel");
    const videoPlayerBox = document.getElementById("media-video-player");
    const videoElement = document.getElementById("product-video");
    const dotsContainer = document.getElementById("carousel-dots");
    
    mediaContainer.innerHTML = ''; dotsContainer.innerHTML = ''; videoPlayerBox.style.display = 'none'; 
    if (videoPlayer) videoPlayer.src = '';
    
    const mediaFiles = currentProduct.Media_URLs;
    let imageCount = 0;
    let hasVideo = false;

    mediaFiles.forEach((fileName) => {
        const fullUrl = CONFIG.BASE_STORE_URL + fileName; 
        const lowerCaseFileName = fileName.toLowerCase();
        
        if (lowerCaseFileName.endsWith('.mp4') || lowerCaseFileName.endsWith('.mov') || lowerCaseFileName.endsWith('.webm')) {
            videoElement.src = fullUrl;
            videoPlayer = videoElement;
            hasVideo = true;
        } else {
            const img = document.createElement('img');
            img.src = fullUrl; img.className = 'carousel-image';
            if (imageCount === 0) { img.classList.add('active'); }
            mediaContainer.appendChild(img);
            
            const dot = document.createElement('span');
            dot.className = 'dot'; dot.dataset.index = imageCount; 
            if (imageCount === 0) { dot.classList.add('active'); }
            dot.onclick = () => changeImage(parseInt(dot.dataset.index)); dotsContainer.appendChild(dot);
            imageCount++;
        }
    });

    if (hasVideo) {
        // 9:16 Video (Height 177.77% of width)
        mediaWrapper.style.paddingTop = '177.77%'; 
        videoPlayerBox.style.display = 'block';
        dotsContainer.style.display = 'none';
        mediaContainer.style.display = 'none';
    } else if (imageCount > 0) {
        // 1:1 Images
        mediaWrapper.style.paddingTop = '100%';
        dotsContainer.style.display = imageCount > 1 ? 'flex' : 'none';
        mediaContainer.style.display = 'block';
        if (imageCount > 1) { 
            startImageCarousel(imageCount); 
        } else {
            if (carouselTimer) clearInterval(carouselTimer);
        }
    } else {
        mediaWrapper.style.paddingTop = '0';
    }
}

function toggleVideoPlay() {
    if (!videoPlayer) return;
    if (isVideoPlaying) {
        videoPlayer.pause();
        document.getElementById("video-play-pause-btn").innerHTML = '<i class="fas fa-play"></i>';
    } else {
        videoPlayer.play();
        document.getElementById("video-play-pause-btn").innerHTML = '<i class="fas fa-pause"></i>';
    }
    isVideoPlaying = !isVideoPlaying;
}

// V22 FIX: 2 second interval
function startImageCarousel(count) { 
    if (carouselTimer) clearInterval(carouselTimer);
    if (count <= 1) return;
    carouselTimer = setInterval(() => {
        let newIndex = (currentMediaIndex + 1) % count;
        changeImage(newIndex);
    }, 2000); 
}

function changeImage(index) { 
    const images = document.querySelectorAll('#media-carousel .carousel-image');
    const dots = document.querySelectorAll('#carousel-dots .dot');
    const count = images.length;
    if (count === 0) return;

    images.forEach((img, idx) => {
        img.classList.toggle('active', idx === index);
    });
    dots.forEach((dot, idx) => {
        dot.classList.toggle('active', idx === index);
    });
    currentMediaIndex = index;
    if (carouselTimer) clearInterval(carouselTimer);
    startImageCarousel(count);
}

function startLiveNotifications() { /* ... (Same Notification Logic) ... */ }

// V22 FIX: Corrected handleBuyNow and submitOrder for functionality
function handleBuyNow() { 
    if (!currentProduct) {
        alert("Product data is still loading. Please wait a moment."); 
        return;
    } 
    const itemPrice = isOfferActive ? parseFloat(offerPrice) : parseFloat(actualPrice);
    showOrderForm(itemPrice); 
}
function updateTotalPrice(itemPrice, qty) { if (isNaN(itemPrice)) itemPrice = 0; const totalPrice = (itemPrice * qty).toFixed(0); const priceDisplayElement = document.getElementById("total-price-display"); const submitBtnElement = document.getElementById("order-form-submit-btn"); if (priceDisplayElement) priceDisplayElement.textContent = `₹${totalPrice}`; if (submitBtnElement) submitBtnElement.textContent = `Place COD Order (₹${totalPrice})`; return totalPrice; }
function showOrderForm(itemPrice) { 
    const paymentMode = "COD_ONLY"; 
    const senderName = document.getElementById("receiver-display-top").textContent || "Direct"; 
    let currentQty = 1;
    let totalPrice = updateTotalPrice(itemPrice, currentQty); 
    document.getElementById("modal-body").dataset.itemPrice = itemPrice;

    const formHtml = `
        <h3 style="color: var(--color-price-cod);">Cash on Delivery Order Form</h3>
        <p style="font-weight: 700; margin-bottom: 15px; text-align: center;">Total Price: <span id="total-price-display">₹${totalPrice}</span></p>
        
        <form id="order-form">
            <div class="form-group-qty">
                <label>1. Quantity</label>
                <div class="qty-control">
                    <button type="button" class="qty-btn" onclick="changeQty(-1)">-</button>
                    <span id="qty-display">${currentQty}</span>
                    <button type="button" class="qty-btn" onclick="changeQty(1)">+</button>
                    <input type="hidden" name="Quantity" id="qty-input" value="${currentQty}">
                </div>
            </div>
            <input type="text" name="Full Name" placeholder="2. Full Name *" required autocomplete="name">
            <input type="text" name="WhatsApp Number" placeholder="3. WhatsApp (10 digits) *" pattern="[6-9][0-9]{9}" required autocomplete="tel">
            <input type="text" name="Area / Locality" placeholder="4. Area / Locality *" required>
            <input type="text" name="Landmark / Road Name" placeholder="5. Landmark / Road Name *" required>
            <input type="text" name="Village / Town" placeholder="6. Village / Town *" required>
            <input type="text" name="Taluka / Block" placeholder="7. Taluka / Block *" required>
            <input type="text" name="District" placeholder="8. District *" required>
            <input type="text" name="State" placeholder="9. State *" required>
            <input type="text" name="Pincode" placeholder="10. Pincode (6 digits) *" pattern="[0-9]{6}" required>
            
            <button type="submit" id="order-form-submit-btn" class="primary-btn btn-base">Place COD Order (₹${totalPrice})</button>
        </form>
    `;
    showModal(formHtml); 
    
    document.getElementById("order-form").addEventListener('submit', (event) => {
        submitOrder(event, itemPrice, paymentMode, senderName);
    });
}
function changeQty(delta) { /* ... */ }
function submitOrder(event, itemPrice, paymentMode, senderName) { 
    event.preventDefault(); 
    const form = document.getElementById("order-form"); 
    const formData = new FormData(form); 
    const qty = parseInt(document.getElementById("qty-input").value);
    const totalPrice = updateTotalPrice(itemPrice, qty); 
    const data = { 
        "Product Name": currentProduct["Product Name"] || "Unknown", 
        "Price": totalPrice, 
        "Quantity": qty,      
        "Payment Mode": paymentMode,
