<style>
/* --- STYLES (V12) --- */
:root {
--color-bg-dark: #5C1A00;
--color-bg-darker: #2C0A0A;
--color-card-bg: #ffffff;
--color-primary-text: #000000;
--color-primary-btn: #FF6B00;
--color-price-cod: #dc3545;
--color-gold: #FFD700;
--color-brown: #8B4513;
--color-whatsapp: #25D366;
}
* {
box-sizing: border-box;
margin: 0;
padding: 0;
font-family: 'Poppins', sans-serif;
-webkit-tap-highlight-color: transparent;
user-select: none;
}
html, body { height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; background: #000; }
#app-container { width: 100vw; height: 100vh; max-width: min(100vw, 56.25vh); margin: auto; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--color-bg-dark) 0%, var(--color-bg-darker) 100%); box-shadow: 0 0 40px rgba(255, 107, 53, 0.6); color: var(--color-primary-text); position: relative; overflow-y: auto; overflow-x: hidden; padding-bottom: 5px; }
#content-area { padding: 0 8px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; }
.diya-decoration { position: absolute; top: 8px; font-size: 14px; z-index: 20; text-shadow: 0 0 10px var(--color-gold); animation: pulse 2s infinite alternate; }
.diya-left { left: 15px; transform: rotate(-15deg); }
.diya-right { right: 15px; transform: rotate(15deg); }
@keyframes pulse { 0% { transform: scale(1); opacity: 0.9; } 100% { transform: scale(1.1); opacity: 1; } }
#top-header-wish { text-align: center; padding: 10px 0 2px 0; color: #FFE4B5; font-weight: 600; position: relative; z-index: 10; }
.receiver-header { font-size: 20px; font-weight: 900; color: var(--color-gold); text-shadow: 1px 1px 3px rgba(0,0,0,0.7); font-family: cursive; margin-bottom: 2px; }
.festival-text { font-size: 11px; font-weight: 700; margin: 2px 0; display: flex; justify-content: center; align-items: center; gap: 5px; }
.audio-icon-btn { background: rgba(255,215,0,0.25); border: 1.5px solid var(--color-gold); border-radius: 50%; width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; }
.store-title-top { font-size: 9px; font-style: italic; font-weight: 600; letter-spacing: 0.5px; color: #FFE4B5; opacity: 0.8; }

/* --- PRODUCT CARD & MEDIA --- */
#product-card { background-color: var(--color-card-bg); border-radius: 12px; padding: 8px; margin: 3px 0; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2); text-align: left; flex-shrink: 0; border: 2px solid var(--color-brown); position: relative; }
.product-name-main { font-size: 11px; font-weight: 800; margin-bottom: 5px; text-align: center; color: #333; }
#media-box { width: 100%; height: 130px; margin-bottom: 5px; border: 1px solid #ddd; position: relative; border-radius: 6px; overflow: hidden; background: #f0f0f0; cursor: pointer; }
.carousel-image { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.5s ease-in-out; }
.carousel-image.active { opacity: 1; }
#media-box video { width: 100%; height: 100%; object-fit: contain; display: block; background: black; }
.media-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.6); color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 20px; border: 2px solid white; cursor: pointer; z-index: 10; opacity: 0.9; transition: opacity 0.2s; }
.carousel-dots { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; z-index: 5; }
.dot { width: 6px; height: 6px; background: rgba(255, 255, 255, 0.5); border-radius: 50%; cursor: pointer; transition: background 0.3s; }
.dot.active { background: var(--color-primary-btn); }

/* --- PRICE, TIMER, BUTTONS --- */
#price-timer-container { text-align: center; margin-bottom: 3px; }
#price-section { margin-bottom: 2px; }
.price-actual { font-size: 14px; font-weight: 400; color: #999; text-decoration: line-through; margin-right: 8px; display: inline-block; }
.price-offer { font-size: 22px; font-weight: 900; color: var(--color-price-cod); }
.offer-text-label { font-size: 9px; font-weight: 700; color: var(--color-price-cod); margin-left: 5px; }
#review-bar { text-align: center; margin-bottom: 3px; color: var(--color-gold); font-size: 10px; display: flex; align-items: center; justify-content: center; gap: 5px; }
#timer-below-price { display: flex; justify-content: center; align-items: center; gap: 6px; padding: 2px 5px; max-width: 200px; margin: 3px auto; }
#timer-below-price .label { font-size: 8px; font-weight: 600; color: var(--color-price-cod); }
#timer-below-price .time { font-size: 11px; font-weight: 800; color: var(--color-price-cod); }
#description-text { font-size: 8px; color: #666; margin-bottom: 3px; font-weight: 500; line-height: 1.2; }
.bold-offer-text { font-weight: 800; color: var(--color-price-cod); display: block; margin-top: 2px; font-size: 10px; }
.btn-base { padding: 7px 10px; margin-bottom: 3px; border-radius: 14px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; }
.primary-btn { background: var(--color-primary-btn); color: white; transition: background 0.3s; }
#buy-now-btn { width: 50%; margin: 3px auto 5px; display: block; }

/* --- SHARE SECTION --- */
#share-section-box { padding: 5px; margin-top: 3px; border-radius: 6px; flex-shrink: 1; background: rgba(0,0,0,0.1); }
#share-label { font-size: 9px; margin-bottom: 3px; color: #FFE4B5; }
.share-input-row { display: flex; gap: 5px; margin-bottom: 5px; }
.input-group { flex: 1; }
.input-label-white { font-size: 8px; margin-bottom: 2px; color: #FFE4B5; display: block; text-align: left; }
.share-input-field { width: 100%; padding: 5px; border-radius: 4px; font-size: 9px; border: 1px solid #ccc; }
.share-btn { padding: 7px; border-radius: 14px; font-size: 11px; width: 100%; background: var(--color-whatsapp); color: white; }

/* --- MODAL FORM STYLES (New) --- */
#modal .modal-content input, #modal .modal-content select, #modal .modal-content textarea { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; box-sizing: border-box; }
#modal .modal-content button[type="submit"] { margin-top: 10px; }
.form-group-qty { display: flex; justify-content: space-between; align-items: center; background: #f0f0f0; padding: 8px; border-radius: 4px; margin-bottom: 8px; }
.form-group-qty label { font-size: 11px; font-weight: bold; color: #333; }
.qty-control { display: flex; align-items: center; }
.qty-btn { background: var(--color-primary-btn); color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 0 5px; }
#qty-display { font-weight: bold; font-size: 14px; width: 25px; text-align: center; }
#total-price-display { font-size: 18px; font-weight: 900; color: var(--color-price-cod); margin-left: 10px; }
</style>
</head>

<script>
// === CONFIGURATION (V12) ===
const CONFIG = {
    // 💡 UPDATED with your provided Google Apps Script URL
    ORDER_SUBMIT_API: "https://script.google.com/macros/s/AKfycbw9benSD2ZQN3ElLygSyZdoByy7FSiAplJ7Pcaa9QwZcFPVFrqgJvMmSlTyoI6NGff/exec",
    ADMIN_WHATSAPP: "919226949557",
    BASE_STORE_URL: "https://genzygifts.github.io/GenzyGifts/",
    PRODUCT_JSON_FILE: "product_data.json",
    LIVE_ORDERS: [
        { name: "Suresh", city: "Mumbai" },
        { name: "Pooja", city: "Pune" },
        { name: "Rajat", city: "Delhi" },
        { name: "Neha", city: "Bangalore" },
        { name: "Amit", city: "Jaipur" }
    ]
};

let currentProduct = null, audioPlayed = false, carouselTimer = null, currentMediaIndex = 0;
let isOfferActive = true; 
let actualPrice = null; 
let offerPrice = null; 
let videoPlayer = null;
let isVideoPlaying = false;


// === UTILITY FUNCTIONS (Unchanged) ===
function checkKey(e) { if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 83)) || (e.ctrlKey && e.keyCode === 85)) { e.preventDefault(); return false; } if (e.key === 'Escape') hideModal(); return true; }
function getUrlParams() { const params = {}; window.location.search.substring(1).split("&").forEach(pair => { const [key, value] = pair.split("=").map(decodeURIComponent); if (key) params[key] = value; }); return params; }
function showModal(content) { document.getElementById("modal-body").innerHTML = content; document.getElementById("modal").classList.remove("hidden"); }
function hideModal() { document.getElementById("modal").classList.add("hidden"); if(videoPlayer && isVideoPlaying) { videoPlayer.pause(); document.getElementById("video-play-pause-btn").innerHTML = '<i class="fas fa-play"></i>'; isVideoPlaying = false; } }
function startCountdown() { const TIMER_KEY = 'diwali_offer_timer'; let countDownDate; const saved = localStorage.getItem(TIMER_KEY); const isExpired = localStorage.getItem('isOfferExpired') === 'true'; if (isExpired) { isOfferActive = false; updateStoreUI(); document.getElementById("timer-below-price").classList.add("hidden"); return; } if (saved) { countDownDate = parseInt(saved); } else { const minutes = Math.floor(Math.random() * 6) + 10; countDownDate = new Date().getTime() + minutes * 60 * 1000; localStorage.setItem(TIMER_KEY, countDownDate.toString()); } const countdownElement = document.getElementById("countdown"); const timerBox = document.getElementById("timer-below-price"); const x = setInterval(() => { const now = new Date().getTime(), distance = countDownDate - now; if (distance < 0) { clearInterval(x); countdownElement.textContent = "EXPIRED"; timerBox.classList.add("hidden"); isOfferActive = false; localStorage.setItem('isOfferExpired', 'true'); localStorage.removeItem(TIMER_KEY); updateStoreUI(); return; } isOfferActive = true; timerBox.classList.remove("hidden"); const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)); const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)); const seconds = Math.floor((distance % (1000 * 60)) / 1000); countdownElement.textContent = (hours < 10 ? "0" + hours : hours) + "H : " + (minutes < 10 ? "0" + minutes : minutes) + "M : " + (seconds < 10 ? "0" + seconds : seconds) + "S"; }, 1000); }
function generateTtsUrl(receiverName, senderName) { const TTS_ENDPOINT = "https://corsproxy.io/?https://translate.google.com/translate_tts?ie=UTF-8&tl=hi&client=tw-ob&q="; const params = getUrlParams(), shareStatus = params.status; let ttsMessage; if (shareStatus === "bought" || shareStatus === "paid") { ttsMessage = `नमस्ते${receiverName}! आपके दोस्त ${senderName} ने भी इसे अभी-अभी order किया है।`; } else if (params.sender && "Priya" !== params.sender) { ttsMessage = `नमस्ते${receiverName}! ${senderName} की ओर से यह special offer आपके लिए है।`; } else { ttsMessage = `नमस्ते${receiverName}! अपना name डालके Wish share करें।`; } return TTS_ENDPOINT + encodeURIComponent(ttsMessage); }
function playAudio(receiverName) { if (audioPlayed || !currentProduct) return; const params = getUrlParams(), senderName = params.sender || "Priya"; const audio = document.getElementById("tts-audio"); audio.src = generateTtsUrl(receiverName, senderName); audio.onended = () => { audioPlayed = true; }; audio.play().catch(() => { audioPlayed = false; }); }
function playAudioManually() { const params = getUrlParams(); const receiverName = params.sender ? decodeURIComponent(params.sender) : "Priya"; audioPlayed = false; playAudio(receiverName); }
function updateMetaTags(productName, price) { const titleTag = document.querySelector('meta[property="og:title"]'); if (titleTag) { titleTag.setAttribute('content', `${productName} | Offer Price ₹${price}`); } }
async function fetchProductData() {
    try {
        const response = await fetch(CONFIG.PRODUCT_JSON_FILE);
        if (!response.ok) throw new Error("Failed to fetch product_data.json.");
        const data = await response.json();
        currentProduct = data;
        
        actualPrice = currentProduct.COD_Actual_Price || "999";
        offerPrice = currentProduct.COD_Offer_Price || "799";
        
        startCountdown();
        updateStoreUI(); 
        startMediaDisplay();
        startLiveNotifications(); 

        const finalPrice = isOfferActive ? offerPrice : actualPrice;
        updateMetaTags(currentProduct["Product Name"] || "Diwali Gift Box", finalPrice);
    } catch (error) {
        console.error("Error fetching product data:", error);
        document.getElementById("product-name-static").textContent = "DATA ERROR: Product Not Found";
        document.getElementById("buy-now-btn").textContent = "Error";
        document.getElementById("buy-now-btn").disabled = true;
    }
}
function updateStoreUI() {
    if (!currentProduct) return;
    const params = getUrlParams(), finalReceiverName = params.sender ? decodeURIComponent(params.sender) : "Priya";
    
    document.getElementById("receiver-display-top").textContent = finalReceiverName;
    document.getElementById("product-name-static").textContent = currentProduct["Product Name"] || "Diwali Gift Box";
    
    const priceActualDisplay = document.getElementById("price-actual-main");
    const priceOfferDisplay = document.getElementById("price-offer-main");
    const offerLabel = document.querySelector('.offer-text-label');
    const actualPriceElement = document.querySelector('.price-actual');
    const timerBox = document.getElementById("timer-below-price");
    const buyBtn = document.getElementById("buy-now-btn");

    priceActualDisplay.textContent = actualPrice;
    priceOfferDisplay.textContent = isOfferActive ? offerPrice : actualPrice;

    if (isOfferActive) {
        actualPriceElement.style.display = 'inline-block';
        offerLabel.textContent = 'OFFER!';
        timerBox.classList.remove("hidden");
    } else {
        actualPriceElement.style.display = 'none';
        offerLabel.textContent = 'ACTUAL PRICE';
        timerBox.classList.add("hidden");
    }
    
    document.getElementById("description-text").textContent = currentProduct.Description || "Experience the joy...";
    
    buyBtn.textContent = `Buy Now`;
    buyBtn.disabled = false;
    
    const reviewBar = document.querySelector('#review-bar .review-count');
    if(reviewBar) reviewBar.textContent = `(${currentProduct.reviews || 0} Reviews | ${currentProduct.rating || 4.5}/5)`;
    
    const waLink = `https://wa.me/${CONFIG.ADMIN_WHATSAPP}?text=Hi! I am interested in the ${currentProduct["Product Name"]}`;
    document.getElementById("floating-whatsapp").href = waLink;

    setTimeout(() => { if (!audioPlayed) playAudio(finalReceiverName); }, 1000);
}


// === ORDER FLOW (V12: QUANTITY and NEW FORM LOGIC) ===
function handleBuyNow() { 
    if (!currentProduct) return alert("Loading..."); 
    const itemPrice = isOfferActive ? parseFloat(offerPrice) : parseFloat(actualPrice);
    showOrderForm(itemPrice); 
}

function updateTotalPrice(itemPrice, qty) {
    const totalPrice = (itemPrice * qty).toFixed(0); // Calculate total price
    document.getElementById("total-price-display").textContent = `₹${totalPrice}`;
    document.getElementById("order-form-submit-btn").textContent = `Place COD Order (₹${totalPrice})`;
    return totalPrice;
}

function showOrderForm(itemPrice) { 
    const paymentMode = "COD_ONLY"; 
    const senderName = document.getElementById("receiver-display-top").textContent || "Direct"; 
    
    let currentQty = 1;
    let totalPrice = updateTotalPrice(itemPrice, currentQty);

    // Form HTML with all 10 fields + Quantity control
    const formHtml = `
        <h3 style="color: var(--color-price-cod);">Cash on Delivery Order Form</h3>
        <p style="font-weight: 700; margin-bottom: 15px; text-align: center;">Total Price: <span id="total-price-display">₹${totalPrice}</span></p>
        
        <form id="order-form" onsubmit="submitOrder(event, '${itemPrice}', '${paymentMode}', '${senderName}'); return false;">
            
            <div class="form-group-qty">
                <label>1. Quantity</label>
                <div class="qty-control">
                    <button type="button" class="qty-btn" onclick="changeQty(${itemPrice}, -1)">-</button>
                    <span id="qty-display">${currentQty}</span>
                    <button type="button" class="qty-btn" onclick="changeQty(${itemPrice}, 1)">+</button>
                    <input type="hidden" name="Quantity" id="qty-input" value="${currentQty}">
                </div>
            </div>

            <input type="text" name="Full Name" placeholder="2. Full Name *" required autocomplete="name">
            <input type="text" name="WhatsApp Number" placeholder="3. WhatsApp (10 digits) *" pattern="[6-9][0-9]{9}" required autocomplete="tel">
            
            <input type="text" name="Area / Locality" placeholder="4. Area / Locality *" required>
            <input type="text" name="Landmark / Road Name" placeholder="5. Landmark / Road Name *" required>
            <input type="text" name="Village / Town" placeholder="6. Village / Town *" required>
            <input type="text" name="Taluka / Block" placeholder="7. Taluka / Block *" required>
            <input type="text" name="District" placeholder="8. District *" required>
            <input type="text" name="State" placeholder="9. State *" required>
            <input type="text" name="Pincode" placeholder="10. Pincode (6 digits) *" pattern="[0-9]{6}" required>
            
            <button type="submit" id="order-form-submit-btn" class="primary-btn btn-base">Place COD Order (₹${totalPrice})</button>
        </form>
    `;
    showModal(formHtml); 
}

function changeQty(itemPrice, delta) {
    const qtyDisplay = document.getElementById("qty-display");
    const qtyInput = document.getElementById("qty-input");
    
    let newQty = parseInt(qtyDisplay.textContent) + delta;
    
    if (newQty < 1) newQty = 1; // Minimum Quantity is 1
    
    qtyDisplay.textContent = newQty;
    qtyInput.value = newQty;
    
    updateTotalPrice(itemPrice, newQty);
}

function submitOrder(event, itemPrice, paymentMode, senderName) { 
    event.preventDefault(); 
    const form = document.getElementById("order-form"); 
    const formData = new FormData(form); 
    
    const qty = parseInt(document.getElementById("qty-input").value);
    const totalPrice = updateTotalPrice(itemPrice, qty); // Final calculation

    const data = { 
        "Product Name": currentProduct["Product Name"] || "Unknown", 
        "Price": totalPrice, // Save Total Price
        "Quantity": qty,      // Save Quantity
        "Payment Mode": paymentMode, 
        "Wish Sender": senderName, 
        "Payment Status": "COD_CONFIRMED" 
    }; 
    
    // Add all form data fields to the data object
    formData.forEach((value, key) => { 
        // Correcting field names to match Google Sheet Headers (e.g., "Full Name" instead of "Customer Name")
        if (key !== 'Quantity') { // Quantity is handled above
             data[key] = value;
        }
    }); 
    
    finalSubmitOrder(data); 
}

function finalSubmitOrder(data) { 
    if (typeof data === 'string') data = JSON.parse(data); 
    showModal(` 
        <h3 style="color: var(--color-primary-btn);"> <span class="loading-spinner"></span> Processing COD Order... </h3> 
        <p>Please wait...</p> 
    `); 
    
    const params = new URLSearchParams(); 
    for (const key in data) params.append(key, data[key]); 
    
    fetch(CONFIG.ORDER_SUBMIT_API, { method: "POST", body: params }) 
        .then(response => response.json()) 
        .then(result => { 
            if (result.result === "success") { 
                const customerName = data["Full Name"] || "Customer"; 
                showModal(` 
                    <h3 style="color: var(--color-price-cod);">🎉 Order Confirmed!</h3> 
                    <p style="margin-bottom: 20px;"> आपका COD ऑर्डर कन्फर्म हो गया है! हम आपसे जल्द ही WhatsApp पर संपर्क करेंगे। </p> 
                    <button class="primary-btn btn-base" style="background: linear-gradient(135deg, #25D366, #128C7E);" onclick="hideModal(); showPostPurchaseShareModal('${customerName}');"> 📤 Share Wish </button> 
                `); 
            } else { 
                throw new Error(result.error || "Error"); 
            } 
        }) 
        .catch(error => { 
            console.error("Error submitting order:", error); 
            showModal(` 
                <h3 style="color: var(--color-price-cod);">❌ Failed</h3> 
                <p>ऑर्डर सबमिशन विफल रहा। कृपया फिर से प्रयास करें या WhatsApp पर संपर्क करें।</p> 
                <button class="primary-btn btn-base" onclick="hideModal();">Close</button> 
            `); 
        }); 
}

function showPostPurchaseShareModal(senderName) { showModal(` <h3 style="color: var(--color-price-cod); text-align: center;">🎉 Thank You!</h3> <p style="margin-bottom: 15px; text-align: center; font-weight: 600;">Share this deal with friends!</p> <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 20px;"> <label style="font-weight: 600; color: #666;">Your Name:</label> <input type="text" id="modal-share-sender-input" value="${senderName}" readonly style="background: #f0f0f0; font-weight: bold; text-align: center; padding: 10px; border: 1px solid #ddd; border-radius: 6px;"> <label style="font-weight: 600; color: #666;">Friend's Name:</label> <input type="text" id="modal-share-receiver-input" value="Ram" placeholder="Friend Name" style="border: 2px solid var(--color-primary-btn); text-align: center; padding: 10px; border-radius: 6px;"> <button class="primary-btn btn-base" style="background: linear-gradient(135deg, #25D366, #128C7E); margin-top: 10px;" onclick="handleShareFromModal();"> 📤 Share Now! </button> </div> `); }
function handleShareFromModal() { const senderName = document.getElementById("modal-share-sender-input").value.trim(); const receiverName = document.getElementById("modal-share-receiver-input").value.trim(); if (!senderName || !receiverName || receiverName === "Friend Name") { alert("Please enter friend's name!"); return; } hideModal(); initiateWhatsAppShare(CONFIG.BASE_STORE_URL, senderName, receiverName, true); }
function handleShare() { const senderName = document.getElementById("share-sender-input").value.trim(); const receiverName = document.getElementById("share-receiver-input").value.trim(); if (!senderName || senderName === "Your Name") { alert("कृपया अपना नाम डालें!"); return; } if (!receiverName || receiverName === "Friend Name") { alert("कृपया दोस्त का नाम डालें!"); return; } initiateWhatsAppShare(CONFIG.BASE_STORE_URL, senderName, receiverName, false); }
function initiateWhatsAppShare(baseShareUrl, senderName, receiverName, isBought) {
    let finalShareUrl = baseShareUrl;
    let shareText;
    const productName = currentProduct["Product Name"] || "Diwali Gift Box";
    const customWishText = `*।। ⛄🥰आपको और आपके परिवार को मेरी ओर से शुभ दीपावली 🎁🌷।।\nमां लक्ष्मी और गणेश जी की कृपा आप पर सदा बनी रहे 🌺🙏 ।।*`;

    let customMsg;
    if (isBought) {
        finalShareUrl = baseShareUrl + `?sender=${encodeURIComponent(receiverName)}&status=bought`;
        customMsg = `_Hi ${receiverName} मुझे ए Product ${productName} बहोत ही पसंद आया मैंने तो अभी अभी Order दिया है। मुझे लगा तुम्हें भी पसंद आएगा। खरीद ने के लिए नीचे लिंक पर क्लिक करें।_`;
    } else {
        finalShareUrl = baseShareUrl + `?sender=${encodeURIComponent(receiverName)}`;
        customMsg = `_Hi ${receiverName} मुझे ए Product ${productName} बहोत ही पसंद आया । मुझे लगा तुम्हें भी पसंद आएगा। खरीद ने के लिए नीचे लिंक पर क्लिक करें।_`;
    }
    
    shareText = `*${senderName.toUpperCase()}*\n\n${customWishText}\n\n${customMsg}\n\n${finalShareUrl}`;
    
    if (navigator.share) {
        navigator.share({ text: shareText, url: finalShareUrl })
            .catch(() => window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, "_blank"));
    } else {
        window.open(`https://wa.me/?text=${encodeURIComponent(shareText)}`, "_blank");
    }
}
